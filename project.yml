name: Blackbook
options:
  bundleIdPrefix: com.blackbookdevelopment
  deploymentTarget:
    iOS: "17.0"
    macOS: "14.0"
  xcodeVersion: "15.0"
settings:
  base:
    SWIFT_VERSION: "5.9"
    ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
schemes:
  Blackbook:
    build:
      targets:
        Blackbook: all
        BlackbookTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - BlackbookTests
    profile:
      config: Release
  BlackbookServer:
    build:
      targets:
        BlackbookServer: all
        BlackbookServerTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - BlackbookServerTests
    profile:
      config: Release
targets:
  Blackbook:
    type: application
    supportedDestinations: [iOS, macOS]
    sources:
      - Blackbook
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.blackbookdevelopment.app
        CODE_SIGN_ENTITLEMENTS: Blackbook/Blackbook.entitlements
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: 37NR4Z7NT6
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_NSContactsUsageDescription: "Blackbook needs access to your contacts to help you track and enrich your relationships."
        INFOPLIST_KEY_NSFaceIDUsageDescription: "Blackbook uses Face ID to protect your data."
        INFOPLIST_KEY_CFBundleDisplayName: Blackbook
        INFOPLIST_KEY_LSApplicationCategoryType: "public.app-category.lifestyle"
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_UISupportedInterfaceOrientations~ipad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
        MARKETING_VERSION: "1.2.0"
        CURRENT_PROJECT_VERSION: "1"
  BlackbookServer:
    type: application
    supportedDestinations: [macOS]
    sources:
      - BlackbookServer
      # Yeackbot Collector (loopback API on 127.0.0.1:4321). Tests and the dev-only SwiftPM
      # manifest/tools stay out of the app.
      - path: collector
        excludes:
          - Package.swift
          - run-tests.sh
          - ".build/**"
          - "Tests/**"
          - "Tools/**"
          - Generated/SelfHandles.example.swift
          - Generated/SelfHandlesFallback.swift
          - Generated/SelfHandles.generated.swift
      # Git-ignored; written by `npm run setup:self`. The pre-build script below creates an
      # empty stub when it is missing so a fresh checkout builds (every send is then refused).
      - path: collector/Generated/SelfHandles.generated.swift
        optional: true
      - path: Blackbook/Models
        excludes:
          - BackupMetadata.swift
      - Blackbook/Utilities/LocalSyncProtocol.swift
      - Blackbook/Utilities/SyncTypes.swift
      - Blackbook/Utilities/ModelSyncApply.swift
      - Blackbook/Utilities/ContactSyncApply.swift
      - Blackbook/Utilities/DateHelpers.swift
      - Blackbook/Utilities/DeviceIdentity.swift
    preBuildScripts:
      - name: Ensure SelfHandles.generated.swift
        basedOnDependencyAnalysis: false
        outputFiles:
          - $(SRCROOT)/collector/Generated/SelfHandles.generated.swift
        script: |
          f="$SRCROOT/collector/Generated/SelfHandles.generated.swift"
          if [ ! -f "$f" ]; then
            printf '%s\n' \
              '// Empty stub written by the Xcode pre-build phase; run `npm run setup:self` to fill it.' \
              'enum GeneratedSelfHandles {' \
              '    static let handles: [String] = []' \
              '}' > "$f"
          fi
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.blackbookdevelopment.server
        CODE_SIGN_ENTITLEMENTS: BlackbookServer/BlackbookServer.entitlements
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: 37NR4Z7NT6
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_LSUIElement: YES
        INFOPLIST_KEY_CFBundleDisplayName: "Yeackbot Collector"
        INFOPLIST_KEY_NSAppleEventsUsageDescription: "Yeackbot Collector sends your daily brief to your own iMessage address through Messages."
        INFOPLIST_KEY_NSContactsUsageDescription: "Yeackbot Collector reads your address book so Yeackbot can match people across sources. It never changes your contacts."
        # Hardened runtime stays off until a built product's designated requirement is verified
        # identical to the installed app's (codesign -d -r-); see docs/design/architecture.md §1a.
        ENABLE_HARDENED_RUNTIME: NO
        MARKETING_VERSION: "2.0.0"
        CURRENT_PROJECT_VERSION: "2"
  BlackbookServerTests:
    type: bundle.unit-test
    supportedDestinations: [macOS]
    # No host app: the collector sources are compiled straight into the bundle so tests never
    # launch BlackbookServer (which would start the legacy sync server and chat.db poller).
    sources:
      - path: collector
        excludes:
          - Package.swift
          - run-tests.sh
          - ".build/**"
          - "Tools/**"
          - "Tests/Fixtures/**"
          - "Tests/Golden/**"
          - Generated/SelfHandles.example.swift
          - Generated/SelfHandles.generated.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.blackbookdevelopment.server.tests
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: 37NR4Z7NT6
        MACOSX_DEPLOYMENT_TARGET: "14.0"
  BlackbookTests:
    type: bundle.unit-test
    supportedDestinations: [iOS, macOS]
    sources:
      - BlackbookTests
    dependencies:
      - target: Blackbook
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES

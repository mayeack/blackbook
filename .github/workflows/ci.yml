name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# A new push to a PR supersedes its running checks; runs on main always finish so every main commit gets a result.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# The native app's TestFlight deploy is retired; it is kept in .github/archived-workflows/ to re-enable later.
jobs:
  # Yeackbot (Node workspaces + collector). The repo is public: lint:pii runs first and gates everything else.
  node:
    name: Yeackbot server, web & PII lint
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: npm

      - name: Install
        run: npm ci

      - name: PII / secret lint
        run: npm run lint:pii

      - name: Typecheck
        run: npm run typecheck

      - name: Tests (shared, server, web)
        run: npm test

      - name: Build (web + server bundle)
        run: npm run build

  collector:
    name: Collector & BlackbookServer
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_26.3.app

      - name: Collector unit tests (SwiftPM)
        run: collector/run-tests.sh

      - name: Build & test BlackbookServer (macOS)
        run: |
          set -o pipefail
          xcodebuild build test \
            -project Blackbook.xcodeproj \
            -scheme BlackbookServer \
            -destination 'platform=macOS' \
            -configuration Debug \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            | xcpretty

  # The legacy native app is no longer shipped, but its Blackbook/Models sources are compiled into the collector.
  app:
    name: Blackbook app (macOS)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_26.3.app

      # The generated TEST_HOST is the iOS bundle layout; the macOS app keeps its binary in Contents/MacOS.
      - name: Build & test (macOS)
        run: |
          set -o pipefail
          xcodebuild build test \
            -project Blackbook.xcodeproj \
            -scheme Blackbook \
            -destination 'platform=macOS' \
            -configuration Debug \
            -resultBundlePath TestResults-macOS \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            'TEST_HOST=$(BUILT_PRODUCTS_DIR)/Blackbook.app/Contents/MacOS/Blackbook' \
            | xcpretty

      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-results-macos
          path: TestResults-macOS.xcresult

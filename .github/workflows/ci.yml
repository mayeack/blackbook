name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Yeackbot (Node workspaces + collector). The repo is public: lint:pii runs first and gates everything else.
  node:
    name: Yeackbot server, web & PII lint
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm

      - name: Install
        run: npm ci

      - name: PII / secret lint
        run: npm run lint:pii

      - name: Typecheck
        run: npm run typecheck

      - name: Tests (shared, server, web)
        run: npm test

      - name: Build (web + server bundle)
        run: npm run build

  collector:
    name: Collector & BlackbookServer
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_26.3.app

      - name: Collector unit tests (SwiftPM)
        run: collector/run-tests.sh

      - name: Build & test BlackbookServer (macOS)
        run: |
          set -o pipefail
          xcodebuild build test \
            -project Blackbook.xcodeproj \
            -scheme BlackbookServer \
            -destination 'platform=macOS' \
            -configuration Debug \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            | xcpretty

  test:
    name: Build & Test
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_26.3.app

      - name: Cache SPM packages
        uses: actions/cache@v4
        with:
          path: |
            ~/Library/Developer/Xcode/DerivedData/**/SourcePackages
          key: ${{ runner.os }}-spm-${{ hashFiles('**/Package.resolved') }}
          restore-keys: ${{ runner.os }}-spm-

      - name: Resolve packages
        run: xcodebuild -resolvePackageDependencies -project Blackbook.xcodeproj -scheme Blackbook

      - name: Build (iOS)
        run: |
          xcodebuild build \
            -project Blackbook.xcodeproj \
            -scheme Blackbook \
            -destination 'platform=iOS Simulator,name=iPhone 16' \
            -configuration Debug \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            | xcpretty

      - name: Test (iOS)
        run: |
          xcodebuild test \
            -project Blackbook.xcodeproj \
            -scheme BlackbookTests \
            -destination 'platform=iOS Simulator,name=iPhone 16' \
            -configuration Debug \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            -resultBundlePath TestResults-iOS \
            | xcpretty

      - name: Build (macOS)
        run: |
          xcodebuild build \
            -project Blackbook.xcodeproj \
            -scheme Blackbook \
            -destination 'platform=macOS' \
            -configuration Debug \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            | xcpretty

      - name: Test (macOS)
        run: |
          xcodebuild test \
            -project Blackbook.xcodeproj \
            -scheme BlackbookTests \
            -destination 'platform=macOS' \
            -configuration Debug \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            -resultBundlePath TestResults-macOS \
            | xcpretty

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: |
            TestResults-iOS.xcresult
            TestResults-macOS.xcresult

  deploy-testflight:
    name: Deploy to TestFlight
    runs-on: macos-15
    needs: [test, node, collector]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_26.3.app

      - name: Install Fastlane
        run: gem install fastlane

      - name: Resolve packages
        run: xcodebuild -resolvePackageDependencies -project Blackbook.xcodeproj -scheme Blackbook

      - name: Install App Store Connect API Key
        env:
          ASC_KEY_CONTENT: ${{ secrets.ASC_KEY_CONTENT }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
        run: |
          mkdir -p ~/private_keys
          echo "$ASC_KEY_CONTENT" | base64 --decode > ~/private_keys/AuthKey_${ASC_KEY_ID}.p8

      - name: Deploy iOS to TestFlight
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ITC_TEAM_ID: ${{ secrets.ITC_TEAM_ID }}
          MATCH_GIT_URL: ${{ secrets.MATCH_GIT_URL }}
          MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}
          MATCH_GIT_BASIC_AUTHORIZATION: ${{ secrets.MATCH_GIT_BASIC_AUTHORIZATION }}
          FASTLANE_XCODEBUILD_SETTINGS_TIMEOUT: 120
          BUILD_NUMBER: ${{ github.run_number }}
        run: fastlane ios beta

      - name: Deploy macOS to TestFlight
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ITC_TEAM_ID: ${{ secrets.ITC_TEAM_ID }}
          MATCH_GIT_URL: ${{ secrets.MATCH_GIT_URL }}
          MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}
          MATCH_GIT_BASIC_AUTHORIZATION: ${{ secrets.MATCH_GIT_BASIC_AUTHORIZATION }}
          XCODEBUILD_AUTHENTICATION_KEY_PATH: ~/private_keys/AuthKey_${{ secrets.ASC_KEY_ID }}.p8
          XCODEBUILD_AUTHENTICATION_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          XCODEBUILD_AUTHENTICATION_KEY_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          FASTLANE_XCODEBUILD_SETTINGS_TIMEOUT: 120
          BUILD_NUMBER: ${{ github.run_number }}
        run: fastlane mac beta
